[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
via_ir = true
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "./deployments" }]

# Arc public testnet — RPC filled from env (never hardcode). See .env.example / §9.
[rpc_endpoints]
arc_testnet = "${ARC_TESTNET_RPC}"
